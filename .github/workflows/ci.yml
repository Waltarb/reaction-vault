name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install server
        run: pip install -e "server[dev]"
      - name: Test
        working-directory: server
        run: pytest -q -rs

  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared tests and desktop compile
        working-directory: clients
        run: ./gradlew :shared:jvmTest :desktopApp:compileKotlin --console=plain
      # The runner image ships an Android SDK, so the Android modules are included automatically.
      - name: Android debug build
        working-directory: clients
        run: ./gradlew :androidApp:assembleDebug --console=plain
