[project]
name = "reaction-vault"
version = "0.1.0"
description = "Self-hosted library for reaction images, GIFs and short clips"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sqlite-vec>=0.1.6",
    "onnxruntime>=1.19",
    "tokenizers>=0.20",
    "numpy>=1.26",
    "pillow>=11.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
vault = "vault.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ffmpeg: needs ffmpeg and ffprobe on PATH"]

[tool.ruff]
line-length = 100
