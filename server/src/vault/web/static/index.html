<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reaction Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form">
    <h1>Vault</h1>
    <p>Paste a device token. Create one on the server with <code>vault token create &lt;name&gt;</code>.</p>
    <label>Token <input id="login-token" type="password" autocomplete="off" required></label>
    <button class="btn primary" type="submit">Sign in</button>
    <p id="login-error" class="error" role="alert"></p>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside class="side" aria-label="Library">
    <div class="brand">Vault</div>
    <nav id="nav" class="nav"></nav>
    <div class="side-title">Collections</div>
    <nav id="collections" class="nav"></nav>
    <button id="new-collection" class="nav-item muted" type="button">+ New collection</button>
    <div class="grow"></div>
    <div id="server-card" class="server-card"></div>
  </aside>

  <main class="main">
    <header class="bar">
      <label class="search">
        <span class="sr">Search your vault</span>
        <input id="q" type="search" placeholder="Search by vibe: smug frog, coping…" autocomplete="off">
      </label>
      <button id="add-url" class="btn" type="button">Add URL</button>
      <button id="add" class="btn primary" type="button">+ Add</button>
      <input id="file" type="file" accept="image/*,video/mp4,video/webm" multiple hidden>
    </header>
    <div id="chips" class="chips" role="group" aria-label="Filters"></div>
    <div class="section-head"><h2 id="title">Recently saved</h2><span id="count" class="muted"></span></div>
    <div id="grid" class="grid"></div>
    <div class="more"><button id="more" class="btn" type="button" hidden>Load more</button></div>
    <p id="empty" class="empty" hidden></p>
  </main>
</div>

<dialog id="detail" class="sheet" aria-label="Item detail"></dialog>
<dialog id="save" class="sheet" aria-label="Save to Vault"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="drop" class="drop" hidden>Drop to save</div>
<script src="/static/app.js"></script>
</body>
</html>
